<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đặt lại mật khẩu - Square</title>
<link rel="icon" type="image/png" href="icon.png">
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;
       background:#050505;color:#fff;font-family:'Segoe UI',Arial,sans-serif}
  .card{width:100%;max-width:420px;background:rgba(15,15,15,.98);border:1px solid #ffd700;border-radius:12px;
        padding:32px 28px;text-align:center;box-shadow:0 0 50px #000}
  .logo{width:96px;height:96px;border-radius:20px;box-shadow:0 4px 18px rgba(255,215,0,.35);margin-bottom:10px}
  h1{margin:0;color:#ffd700;letter-spacing:2px;font-size:26px}
  h2{margin:18px 0 6px;font-size:18px}
  .sub{color:#aaa;font-size:13px;margin:0 0 14px;word-break:break-all}
  label{display:block;text-align:left;font-size:12px;color:#ccc;margin-top:10px}
  input{display:block;width:100%;margin:5px 0 4px;padding:11px 12px;background:#1c1c1c;color:#fff;
        border:1px solid #555;border-radius:6px;font-size:15px}
  input:focus{outline:none;border-color:#ffd700}
  .btn{display:block;width:100%;margin-top:16px;padding:13px;border:none;border-radius:6px;background:#f1c40f;
       color:#000;font-weight:700;font-size:15px;cursor:pointer;text-transform:uppercase;letter-spacing:1px;
       text-decoration:none}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn:hover:not(:disabled){filter:brightness(1.1)}
  .msg{font-size:13px;line-height:1.5;margin:10px 0 0;padding:9px 10px;border-radius:6px;text-align:left;display:none}
  .msg.error{display:block;background:rgba(231,76,60,.2);border:1px solid #e74c3c;color:#ff8a80}
  .msg.success{display:block;background:rgba(46,204,113,.2);border:1px solid #2ecc71;color:#80e27e}
  .msg.info{display:block;background:rgba(255,255,255,.06);border:1px solid #555;color:#ccc}
  #form,#backBtn{display:none}
</style>
</head>
<body>
<div class="card">
  <img class="logo" src="icon.png" alt="Logo Square">
  <h1>SQUARE</h1>
  <h2 id="title">Đang kiểm tra liên kết...</h2>
  <p class="sub" id="email"></p>

  <div id="form">
    <label for="pass1">Mật khẩu mới</label>
    <input id="pass1" type="password" autocomplete="new-password" placeholder="Tối thiểu 6 ký tự">
    <label for="pass2">Nhập lại mật khẩu mới</label>
    <input id="pass2" type="password" autocomplete="new-password" placeholder="Nhập lại để xác nhận">
    <button class="btn" id="submitBtn" type="button" onclick="submitNewPassword()">Đổi mật khẩu</button>
  </div>

  <div class="msg" id="msg"></div>
  <a class="btn" id="backBtn" href="index.html">Quay lại game</a>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyD1HzwERZi3KEREUTwE8k5fnihZCYsqX84",
  authDomain: "square-bd9a2.firebaseapp.com",
  projectId: "square-bd9a2"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
auth.languageCode = 'vi';

const params = new URLSearchParams(location.search);
const mode = params.get('mode');
const oobCode = params.get('oobCode');
const continueUrl = params.get('continueUrl');

const $ = id => document.getElementById(id);

// Chỉ cho quay về địa chỉ cùng tên miền với trang này (tránh bị lợi dụng chuyển hướng sang trang lạ)
function safeBackUrl() {
  try {
    const u = new URL(continueUrl, location.href);
    if (u.hostname === location.hostname) return u.href;
  } catch (_) {}
  return 'index.html';
}

function setMsg(text, type) {
  const m = $('msg');
  m.textContent = text || '';
  m.className = text ? 'msg ' + type : 'msg';
}

function errorText(err) {
  const map = {
    'auth/expired-action-code': 'Liên kết đã hết hạn. Hãy quay lại game và bấm "Quên mật khẩu" để nhận liên kết mới.',
    'auth/invalid-action-code': 'Liên kết không hợp lệ hoặc đã được sử dụng. Hãy yêu cầu gửi lại liên kết mới.',
    'auth/user-disabled': 'Tài khoản này đã bị vô hiệu hóa.',
    'auth/user-not-found': 'Không tìm thấy tài khoản tương ứng với liên kết này.',
    'auth/weak-password': 'Mật khẩu quá yếu. Hãy chọn mật khẩu dài hơn.',
    'auth/network-request-failed': 'Lỗi kết nối mạng, vui lòng thử lại.'
  };
  return (err && map[err.code]) || 'Đã xảy ra lỗi. Vui lòng thử lại hoặc yêu cầu liên kết mới.';
}

function showBackButton(label) {
  const b = $('backBtn');
  b.href = safeBackUrl();
  if (label) b.textContent = label;
  b.style.display = 'block';
}

async function handleResetPassword() {
  try {
    const email = await auth.verifyPasswordResetCode(oobCode);
    $('title').textContent = 'Đặt lại mật khẩu';
    $('email').textContent = 'Tài khoản: ' + email;
    $('form').style.display = 'block';
    $('pass1').focus();
  } catch (err) {
    $('title').textContent = 'Không thể đặt lại mật khẩu';
    setMsg(errorText(err), 'error');
    showBackButton('Quay lại game');
  }
}

async function submitNewPassword() {
  const p1 = $('pass1').value, p2 = $('pass2').value;
  if (p1.length < 6) return setMsg('Mật khẩu phải có ít nhất 6 ký tự.', 'error');
  if (p1 !== p2) return setMsg('Hai mật khẩu nhập vào không giống nhau.', 'error');

  const btn = $('submitBtn');
  btn.disabled = true;
  setMsg('Đang lưu mật khẩu mới...', 'info');
  try {
    await auth.confirmPasswordReset(oobCode, p1);
    $('form').style.display = 'none';
    $('email').textContent = '';
    $('title').textContent = 'Đã đổi mật khẩu thành công';
    setMsg('Bạn có thể quay lại game và đăng nhập bằng mật khẩu mới.', 'success');
    showBackButton('Quay lại game');
  } catch (err) {
    btn.disabled = false;
    setMsg(errorText(err), 'error');
  }
}

async function handleVerifyEmail() {
  try {
    await auth.applyActionCode(oobCode);
    $('title').textContent = 'Đã xác minh email';
    setMsg('Email của bạn đã được xác minh.', 'success');
  } catch (err) {
    $('title').textContent = 'Không thể xác minh email';
    setMsg(errorText(err), 'error');
  }
  showBackButton('Quay lại game');
}

if (!mode || !oobCode) {
  $('title').textContent = 'Liên kết không hợp lệ';
  setMsg('Hãy mở liên kết trực tiếp từ email mà Square đã gửi cho bạn.', 'error');
  showBackButton('Về trang game');
} else if (mode === 'resetPassword') {
  handleResetPassword();
} else if (mode === 'verifyEmail') {
  handleVerifyEmail();
} else {
  $('title').textContent = 'Liên kết không được hỗ trợ';
  setMsg('Loại liên kết này chưa được hỗ trợ.', 'error');
  showBackButton('Về trang game');
}

$('pass2').addEventListener('keydown', e => { if (e.key === 'Enter') submitNewPassword(); });
</script>
</body>
</html>
